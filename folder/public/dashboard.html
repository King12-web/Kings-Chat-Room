<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Kings' Chat-Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .dash-main{
    min-height:calc(100vh - 80px);
    display:flex; align-items:center; justify-content:center;
    background:var(--parchment-dim);
    padding:40px 24px;
  }
  .dash-card{
    background:#fff; border-radius:16px; padding:40px;
    max-width:420px; width:100%; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.06);
  }
  .dash-avatar{
    width:72px; height:72px; border-radius:50%;
    background:var(--gold); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:700;
    margin:0 auto 20px; background-size:cover; background-position:center;
  }
  .dash-card h1{ font-size:22px; margin:0 0 6px; }
  .dash-card p{ color:var(--lilac-dim); font-size:14px; margin:0 0 28px; }
</style>
</head>
<body>

<nav>
  <div class="nav-top">
    <a class="logo" href="index.html">
      <svg width="28" height="28" viewBox="0 0 30 30" fill="none">
        <path d="M5 21L5 12L9.5 16L15 8L20.5 16L25 12L25 21H5Z" stroke="#141414" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="15" cy="24" r="1.3" fill="#141414"/>
      </svg>
      <span>Kings' Chat-Room</span>
    </a>
    <div class="navright">
      <button class="btn-gold" id="signOutBtn" type="button">Sign out</button>
    </div>
  </div>
</nav>

<main class="dash-main">
  <div class="dash-card">
    <div class="dash-avatar" id="userAvatar">?</div>
    <h1>Welcome, <span id="welcomeName">there</span></h1>
    <p id="userEmail"></p>
    <p style="color:#888;">This is a placeholder dashboard — replace it with your real chat UI.</p>
  </div>
</main>

<script type="module" src="dashboard.js"></script>
</body>
</html>
