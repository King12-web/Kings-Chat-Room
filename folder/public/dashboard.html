<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rooms · Kings' Chat-Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* DASHBOARD — room list */

.dash-body {
  margin: 0;
  padding-top: 68px;
  min-height: 100vh;
  background: var(--parchment-dim);
}

/* TOP BAR (shared look with room.html, kept per-file to avoid cross-page CSS clashing) */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  height: 68px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 24px;
  background: #efefef;
  border-bottom: 1px solid #e2e2e2;
}
.topbar-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 17px;
}
.profile-section {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn-dark {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--plum-deep);
  color: #fff;
  padding: 9px 16px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13.5px;
  border: 1px solid var(--plum-deep);
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
  flex: none;
  white-space: nowrap;
}
.btn-dark:hover {
  background: #241735;
}

/* NOTIFICATIONS */
.notif-wrap {
  position: relative;
}
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: rgba(0, 0, 0, 0.06);
  color: #444;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  flex: none;
}
.icon-btn .badge {
  position: absolute;
  top: -2px;
  right: -2px;
  background: #c0392b;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  min-width: 16px;
  height: 16px;
  border-radius: 9px;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  border: 2px solid #efefef;
}

.notif-panel {
  display: none;
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
  width: 340px;
  max-width: calc(100vw - 32px);
  max-height: 440px;
  overflow-y: auto;
  z-index: 2000;
}
.notif-panel.open {
  display: block;
}
.notif-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px 10px;
  position: sticky;
  top: 0;
  background: #fff;
}
.notif-panel-head h3 {
  font-size: 15px;
}
.mark-read {
  background: none;
  border: none;
  color: var(--gold);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

.notif-item {
  display: flex;
  gap: 12px;
  padding: 13px 18px;
  border-top: 1px solid #f2f2f2;
}
.notif-item.unread {
  background: #fdf6f2;
}
.notif-icon {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.notif-icon.accept {
  background: #e6f7ec;
  color: #3fb56f;
}
.notif-icon.decline {
  background: #fdeeee;
  color: #c0392b;
}
.notif-icon.verify-pending {
  background: #fff4e6;
  color: #d98c1f;
}
.notif-icon.verify-done {
  background: #e6f7ec;
  color: #3fb56f;
}
.notif-body {
  flex: 1;
  min-width: 0;
}
.notif-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
}
.notif-sub {
  font-size: 11.5px;
  color: var(--lilac-dim);
  margin-top: 2px;
}
.notif-time {
  font-size: 10.5px;
  color: #bbb;
  margin-top: 4px;
}
.notif-resend {
  margin-top: 8px;
  background: none;
  border: 1px solid #d98c1f;
  color: #d98c1f;
  font-size: 11px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 12px;
  cursor: pointer;
  font-family: inherit;
}
.notif-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--lilac-dim);
  font-size: 12.5px;
}

/* DASHBOARD TOAST (verify-email reminder) */
.dash-toast {
  position: fixed;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--plum-deep);
  color: #fff;
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.25);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 2500;
  max-width: calc(100vw - 32px);
}
.dash-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
.dash-toast button {
  background: var(--gold);
  color: #fff;
  border: none;
  padding: 7px 12px;
  border-radius: 10px;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  flex: none;
  white-space: nowrap;
}
.dash-toast .dash-toast-close {
  background: none;
  color: rgba(255, 255, 255, 0.6);
  padding: 0 2px;
  font-size: 16px;
}

/* ROOM LIST */
.rooms-main {
  padding: 48px 24px 60px;
  display: flex;
  justify-content: center;
}
.rooms-wrap {
  width: 100%;
  max-width: 720px;
}
.rooms-wrap h1 {
  font-size: 26px;
  margin: 0 0 4px;
}
.rooms-sub {
  font-size: 13.5px;
  color: var(--lilac-dim);
  margin: 0 0 24px;
}

.create-room-row {
  display: flex;
  gap: 10px;
  margin-bottom: 32px;
}
.create-room-row input {
  flex: 1;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 11px 14px;
  font-family: inherit;
  font-size: 16px; /* avoids iOS auto-zoom on focus */
  background: #fff;
}
.create-room-row input:focus {
  outline: none;
  border-color: var(--gold);
}

.room-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}
.room-list-empty {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: var(--lilac-dim);
  font-size: 13px;
  padding: 50px 20px;
}
.room-list-empty .icon-circle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  font-size: 22px;
}
.spinner {
  width: 26px;
  height: 26px;
  border: 3px solid #e2e2e2;
  border-top-color: var(--gold);
  border-radius: 50%;
  margin-bottom: 14px;
  animation: spin 0.7s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

.room-card {
  display: block;
  background: #fff;
  border-radius: 14px;
  padding: 18px;
  text-decoration: none;
  color: var(--ink);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
  transition: transform 0.1s, box-shadow 0.1s;
}
.room-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
}
.room-card-name {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 4px;
}
.room-card-meta {
  font-size: 11.5px;
  color: var(--lilac-dim);
  margin-bottom: 10px;
}
.room-card-online {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: #3fb56f;
  font-weight: 600;
}
.room-card-online::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #3fb56f;
  display: inline-block;
}

.room-card.room-card-locked {
  cursor: default;
}
.room-card-action {
  margin-top: 10px;
}
.room-status-pending {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: #d98c1f;
  background: #fff4e6;
  padding: 5px 10px;
  border-radius: 12px;
}
.room-request-btn {
  background: var(--plum-deep);
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 16px;
  font-family: inherit;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
}
.room-request-btn:hover {
  background: #241735;
}

@media (max-width: 600px) {
  .topbar {
    padding: 0 14px;
  }
  .btn-dark .label,
  .btn-gold .label {
    display: none;
  }
  .btn-dark,
  .btn-gold {
    padding: 9px 11px;
  }
  .rooms-main {
    padding: 28px 16px 40px;
  }
  .create-room-row {
    flex-direction: column;
  }
  .room-list {
    grid-template-columns: 1fr;
  }

  /* Toast: move from the bottom corner (easy to miss) to just under the
     header, and stack text/button/close vertically instead of a flex row
     squeezing the text into a narrow column */
  .dash-toast {
    top: calc(78px + env(safe-area-inset-top, 0px));
    bottom: auto;
    left: 16px;
    right: 16px;
    transform: translateY(-14px);
    max-width: none;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 16px 40px 16px 16px;
    position: fixed;
  }
  .dash-toast.show {
    transform: translateY(0);
  }
  .dash-toast .dash-toast-close {
    position: absolute;
    top: 10px;
    right: 12px;
  }
  .dash-toast #dashToastAction {
    width: 100%;
    justify-content: center;
  }

  /* Notification panel: on desktop this anchors to the bell icon itself,
     but on a narrow screen that icon isn't near the screen edge, so a
     340px panel anchored to it overflows past the left edge. Switch to a
     fixed-position sheet sized to the viewport instead. */
  .notif-panel {
    position: fixed;
    top: calc(78px + env(safe-area-inset-top, 0px));
    left: 16px;
    right: 16px;
    width: auto;
    max-width: none;
    max-height: calc(100vh - 78px - 24px - env(safe-area-inset-top, 0px));
  }
}

</style>
</head>
<body class="dash-body">

<header class="topbar">
  <div class="topbar-logo">
    <svg width="24" height="24" viewBox="0 0 30 30" fill="none">
      <path d="M5 21L5 12L9.5 16L15 8L20.5 16L25 12L25 21H5Z" stroke="#141414" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="15" cy="24" r="1.3" fill="#141414"/>
    </svg>
    <span>Kings' Chat-Room</span>
  </div>

  <div class="profile-section">
    <div class="notif-wrap">
      <button class="icon-btn" id="notifBtn" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2.5c-2.5 0-4 1.8-4 4.5v2.2c0 .8-.3 1.6-.9 2.2l-.8.9h11.4l-.8-.9c-.6-.6-.9-1.4-.9-2.2V7c0-2.7-1.5-4.5-4-4.5Z" stroke="#444" stroke-width="1.4" stroke-linejoin="round"/><path d="M7.3 14.5a1.9 1.9 0 0 0 3.4 0" stroke="#444" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span class="badge" id="notifBadge">0</span>
      </button>
      <div class="notif-panel" id="notifPanel">
        <div class="notif-panel-head">
          <h3>Notifications</h3>
          <button class="mark-read" id="markAllRead">Mark all read</button>
        </div>
        <div id="notifList"></div>
      </div>
    </div>

    <a class="btn-dark" href="profile.html">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="4.5" r="2.5" stroke="#fff" stroke-width="1.4"/><path d="M2 12.5c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="label">Profile</span>
    </a>
    <button class="btn-gold" id="signOutBtn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5.5 12.5H2.8A1.3 1.3 0 0 1 1.5 11.2V2.8A1.3 1.3 0 0 1 2.8 1.5h2.7" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 4.5 12.5 8 9 11.5M12.2 8H5.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">Sign out</span>
    </button>
  </div>
</header>

<main class="rooms-main">
  <div class="rooms-wrap">
    <h1>Chat rooms</h1>
    <p class="rooms-sub">Join one below, or start your own.</p>

    <div class="create-room-row">
      <input type="text" id="roomNameInput" placeholder="Name a new room, e.g. Coding">
      <button id="createRoomBtn" class="btn-gold">Create room</button>
    </div>

    <div class="room-list" id="roomList">
      <div class="room-list-empty"><div class="spinner"></div>Loading rooms…</div>
    </div>
  </div>
</main>

<div class="dash-toast" id="dashToast">
  <span id="dashToastText"></span>
  <button id="dashToastAction" style="display:none;"></button>
  <button class="dash-toast-close" id="dashToastClose">&times;</button>
</div>

<script type="module">
// dashboard.js — room list
//
// Data model:
//   rooms/{roomId}                     -> { name, createdBy, createdByName, createdAt }
//   chats/{roomId}/{index}             -> (same shape as the single-room version, just nested under a room now)
//   presence/{roomId}/{uid}            -> true (who's currently inside that specific room)

import { auth, db } from './firebase-config.js';
import { onAuthStateChanged, signOut, sendEmailVerification } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { ref, push, set, update, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
import User from './user.js';

const roomListEl = document.getElementById('roomList');
const roomNameInput = document.getElementById('roomNameInput');
const createRoomBtn = document.getElementById('createRoomBtn');
const signOutBtn = document.getElementById('signOutBtn');
const notifBtn = document.getElementById('notifBtn');
const notifPanel = document.getElementById('notifPanel');
const notifBadge = document.getElementById('notifBadge');
const notifList = document.getElementById('notifList');
const markAllRead = document.getElementById('markAllRead');
const dashToast = document.getElementById('dashToast');
const dashToastText = document.getElementById('dashToastText');
const dashToastAction = document.getElementById('dashToastAction');
const dashToastClose = document.getElementById('dashToastClose');

let currentUser = null;

// ---- Protected route + verification handling ----
onAuthStateChanged(auth, async function (user) {
  if (!user) {
    window.location.href = './signin.html';
    return;
  }
  currentUser = user;

  // Firebase's cached emailVerified flag doesn't update just because someone
  // clicked the link in another tab — reload() pulls the current state from
  // the server, which is how we can detect "they just verified" at all.
  try {
    await currentUser.reload();
  } catch (e) {
    // If this fails (e.g. offline), just fall back to whatever's cached.
  }

  handleVerificationState();
  listenForNotifications();
  startRoomList();
});

function showDashToast(message, actionLabel, actionFn) {
  dashToastText.textContent = message;
  if (actionLabel) {
    dashToastAction.textContent = actionLabel;
    dashToastAction.style.display = 'inline-flex';
    dashToastAction.onclick = actionFn;
  } else {
    dashToastAction.style.display = 'none';
  }
  dashToast.classList.add('show');
}
dashToastClose.addEventListener('click', function () {
  dashToast.classList.remove('show');
});

function resendVerificationEmail() {
  sendEmailVerification(currentUser)
    .then(function () {
      showDashToast('Verification email sent — check your inbox.', null);
    })
    .catch(function (err) {
      showDashToast('Could not send email: ' + err.message, null);
    });
}

async function handleVerificationState() {
  if (!currentUser.emailVerified) {
    showDashToast('Please verify your email to create rooms.', 'Resend email', resendVerificationEmail);
    return;
  }

  // Just verified (or already was) — write a one-time "verified" notification,
  // guarded by a flag on the profile so it never fires more than once.
  const flagRef = ref(db, 'users/' + currentUser.uid + '/verifiedNotified');
  const snap = await new Promise(function (resolve) {
    onValue(flagRef, resolve, { onlyOnce: true });
  });

  if (!snap.exists()) {
    const notifRef = push(ref(db, 'notifications/' + currentUser.uid));
    await set(notifRef, {
      type: 'verify_success',
      message: 'Your email is verified — you can now create rooms.',
      createdAt: new Date().toLocaleString(),
      read: false,
    });
    await update(ref(db, 'users/' + currentUser.uid), { verifiedNotified: true });
  }
}

// ---- Notifications ----
function notifIconHtml(type) {
  if (type === 'join_accepted' || type === 'verify_success') {
    return '<div class="notif-icon accept"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5 6.5 12 13 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  }
  if (type === 'join_declined') {
    return '<div class="notif-icon decline"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>';
  }
  return '<div class="notif-icon verify-pending"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 4.5v4l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/></svg></div>';
}

function listenForNotifications() {
  onValue(ref(db, 'notifications/' + currentUser.uid), function (snapshot) {
    const data = snapshot.val() || {};
    const items = Object.keys(data)
      .map(function (id) { return Object.assign({ id: id }, data[id]); })
      .sort(function (a, b) { return (b.createdAt || '').localeCompare(a.createdAt || ''); });

    let unread = items.filter(function (n) { return !n.read; }).length;

    notifList.innerHTML = '';

    // A live, unstored reminder while the account is unverified — sits at
    // the top of the list alongside real notifications.
    if (!currentUser.emailVerified) {
      unread += 1;
      const el = document.createElement('div');
      el.className = 'notif-item unread';
      el.innerHTML =
        notifIconHtml('verify_pending') +
        '<div class="notif-body">' +
          '<div class="notif-title">Verify your email to create rooms</div>' +
          '<div class="notif-sub">Check your inbox for the confirmation link</div>' +
          '<button class="notif-resend" id="notifResendBtn">Resend email</button>' +
        '</div>';
      notifList.appendChild(el);
      el.querySelector('#notifResendBtn').addEventListener('click', resendVerificationEmail);
    }

    items.forEach(function (n) {
      const el = document.createElement('div');
      el.className = 'notif-item' + (n.read ? '' : ' unread');
      el.innerHTML =
        notifIconHtml(n.type) +
        '<div class="notif-body">' +
          '<div class="notif-title">' + n.message + '</div>' +
          '<div class="notif-time">' + (n.createdAt || '') + '</div>' +
        '</div>';
      notifList.appendChild(el);
    });

    if (notifList.children.length === 0) {
      notifList.innerHTML = '<div class="notif-empty">No notifications yet.</div>';
    }

    notifBadge.textContent = unread;
    notifBadge.style.display = unread > 0 ? 'flex' : 'none';
  });
}

notifBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  notifPanel.classList.toggle('open');
});
document.addEventListener('click', function (e) {
  if (!notifPanel.contains(e.target) && !notifBtn.contains(e.target)) {
    notifPanel.classList.remove('open');
  }
});

markAllRead.addEventListener('click', function () {
  const updates = {};
  onValue(ref(db, 'notifications/' + currentUser.uid), function (snapshot) {
    const data = snapshot.val() || {};
    Object.keys(data).forEach(function (id) {
      updates['notifications/' + currentUser.uid + '/' + id + '/read'] = true;
    });
    update(ref(db), updates);
  }, { onlyOnce: true });
});

// ---- Create a room ----
createRoomBtn.addEventListener('click', createRoom);
roomNameInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') createRoom();
});

function createRoom() {
  const name = roomNameInput.value.trim();
  if (!name || !currentUser) return;

  // The database rules enforce this too (auth.token.email_verified) — this
  // check is just so an unverified user gets a clear message instead of a
  // silent "permission denied" from Firebase.
  if (!currentUser.emailVerified) {
    alert('Please verify your email before creating a room. Check your inbox for the confirmation link.');
    return;
  }

  const storedUser = JSON.parse(localStorage.getItem('user') || 'null');

  // push() gives us a guaranteed-unique key, which matters here since room
  // names are free text and can't safely be used as a database key directly
  // (Firebase keys can't contain characters like "." or "#").
  const newRoomRef = push(ref(db, 'rooms'));
  const newRoomId = newRoomRef.key;

  set(newRoomRef, {
    name: name,
    createdBy: currentUser.uid,
    createdByName: storedUser ? storedUser.fullname : currentUser.email,
    createdAt: new Date().toLocaleString(),
  }).then(function () {
    // The creator is automatically the room's first (and only, for now)
    // member. Required under the new rules -- without this, the creator
    // couldn't read or send messages in the room they just made. Writing
    // both the source-of-truth path and the userMemberships index together,
    // atomically.
    const updates = {};
    updates['rooms/' + newRoomId + '/members/' + currentUser.uid] = true;
    updates['userMemberships/' + currentUser.uid + '/' + newRoomId] = true;
    return update(ref(db), updates);
  }).catch(function (err) {
    alert('Could not create room: ' + err.message);
  });

  roomNameInput.value = '';
}

// ---- Live room list ----
//
// Rather than opening a membership + a request listener for EVERY room
// (which meant 2N+ separate network round-trips and was the actual cause
// of the dashboard feeling slow to load), we read two small per-user
// indexes once: "which rooms am I a member of" and "which am I pending
// on". Combined with the room list itself, that's 3 listeners total,
// regardless of how many rooms exist.
const subscribedPresence = new Set();
let allRoomsData = {};
let myMemberships = {};
let myRequests = {};
let roomListStarted = false;

// Must only be called once currentUser is actually set (i.e. from inside
// onAuthStateChanged) — these listeners read currentUser.uid immediately
// when registered, not just inside their callbacks, so calling this any
// earlier throws (currentUser is still null at script-load time) and
// silently kills every bit of code below it in this script.
function startRoomList() {
  if (roomListStarted) return;
  roomListStarted = true;

  onValue(ref(db, 'rooms'), function (snapshot) {
    allRoomsData = snapshot.val() || {};
    renderRoomList();
  });
  onValue(ref(db, 'userMemberships/' + currentUser.uid), function (snapshot) {
    myMemberships = snapshot.val() || {};
    renderRoomList();
  });
  onValue(ref(db, 'userRequests/' + currentUser.uid), function (snapshot) {
    myRequests = snapshot.val() || {};
    renderRoomList();
  });
}

function renderRoomList() {
  const roomIds = Object.keys(allRoomsData);
  roomListEl.innerHTML = '';

  if (roomIds.length === 0) {
    roomListEl.innerHTML = '<div class="room-list-empty"><div class="icon-circle">💬</div>No rooms yet — create the first one above.</div>';
    return;
  }

  roomIds.forEach(function (roomId) {
    const room = allRoomsData[roomId];
    const isMember = !!myMemberships[roomId];
    const isPending = !!myRequests[roomId];

    const card = document.createElement('a');
    card.className = 'room-card' + (isMember ? '' : ' room-card-locked');
    card.id = 'card-' + roomId;
    if (isMember) card.href = 'room.html?room=' + encodeURIComponent(roomId);

    let actionHtml = '';
    if (isPending) {
      actionHtml = '<span class="room-status-pending">Pending approval</span>';
    } else if (!isMember) {
      actionHtml = '<button class="room-request-btn" data-room-id="' + roomId + '">Request to join</button>';
    }

    card.innerHTML =
      '<div class="room-card-name">' + room.name + '</div>' +
      '<div class="room-card-meta">Started by ' + (room.createdByName || 'someone') + '</div>' +
      '<div class="room-card-online" id="online-' + roomId + '" style="display:none;">0 online</div>' +
      '<div class="room-card-action">' + actionHtml + '</div>';

    roomListEl.appendChild(card);

    if (isMember) maybeSubscribeToPresence(roomId);
  });
}

// The online-count preview needs a presence read, which the rules only
// allow for actual members — so only subscribe (and only show the line at
// all) for rooms we're already confirmed to be in.
function maybeSubscribeToPresence(roomId) {
  if (subscribedPresence.has(roomId)) return;
  subscribedPresence.add(roomId);

  onValue(ref(db, 'presence/' + roomId), function (presenceSnap) {
    const count = presenceSnap.exists() ? Object.keys(presenceSnap.val()).length : 0;
    // Look the element up fresh each time — the list above gets
    // rebuilt on every room list change, so this element is a new node.
    const el = document.getElementById('online-' + roomId);
    if (el) {
      el.style.display = 'inline-flex';
      el.textContent = count + ' online';
    }
  });
}

// One listener on the list container handles every "Request to join" click,
// including ones on cards that get rebuilt later.
roomListEl.addEventListener('click', function (e) {
  const btn = e.target.closest('.room-request-btn');
  if (!btn) return;
  e.preventDefault();

  const roomId = btn.dataset.roomId;
  const storedUser = JSON.parse(localStorage.getItem('user') || 'null');

  const updates = {};
  updates['rooms/' + roomId + '/requests/' + currentUser.uid] = {
    fullname: storedUser ? storedUser.fullname : currentUser.email,
    email: currentUser.email,
    requestedAt: new Date().toLocaleString(),
  };
  updates['userRequests/' + currentUser.uid + '/' + roomId] = true;

  update(ref(db), updates).then(function () {
    showDashToast('Request sent — waiting for the room owner to approve it.', null);
  }).catch(function (err) {
    showDashToast('Could not send request: ' + err.message, null);
  });
});

// ---- Sign out ----
signOutBtn.addEventListener('click', function () {
  if (!confirm('Are you sure you want to sign out?')) return;

  signOut(auth).then(function () {
    User.clearSavedUser();
    window.location.href = './signin.html';
  });
});

</script>
</body>
</html>
