<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooms · Kings' Chat-Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* DASHBOARD — room list */

.dash-body {
  margin: 0;
  padding-top: 68px;
  min-height: 100vh;
  background: var(--parchment-dim);
}

/* TOP BAR (shared look with room.html, kept per-file to avoid cross-page CSS clashing) */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;
  height: 68px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 24px;
  background: #efefef;
  border-bottom: 1px solid #e2e2e2;
}
.topbar-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 17px;
}
.profile-section {
  display: flex;
  align-items: center;
  gap: 10px;
}
.btn-dark {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--plum-deep);
  color: #fff;
  padding: 9px 16px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 13.5px;
  border: 1px solid var(--plum-deep);
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
  flex: none;
  white-space: nowrap;
}
.btn-dark:hover {
  background: #241735;
}

/* ROOM LIST */
.rooms-main {
  padding: 48px 24px 60px;
  display: flex;
  justify-content: center;
}
.rooms-wrap {
  width: 100%;
  max-width: 720px;
}
.rooms-wrap h1 {
  font-size: 26px;
  margin: 0 0 4px;
}
.rooms-sub {
  font-size: 13.5px;
  color: var(--lilac-dim);
  margin: 0 0 24px;
}

.create-room-row {
  display: flex;
  gap: 10px;
  margin-bottom: 32px;
}
.create-room-row input {
  flex: 1;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 11px 14px;
  font-family: inherit;
  font-size: 16px; /* avoids iOS auto-zoom on focus */
  background: #fff;
}
.create-room-row input:focus {
  outline: none;
  border-color: var(--gold);
}

.room-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}
.room-list-empty {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  color: var(--lilac-dim);
  font-size: 13px;
  padding: 50px 20px;
}
.room-list-empty .icon-circle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  font-size: 22px;
}

.room-card {
  display: block;
  background: #fff;
  border-radius: 14px;
  padding: 18px;
  text-decoration: none;
  color: var(--ink);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
  transition: transform 0.1s, box-shadow 0.1s;
}
.room-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
}
.room-card-name {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 4px;
}
.room-card-meta {
  font-size: 11.5px;
  color: var(--lilac-dim);
  margin-bottom: 10px;
}
.room-card-online {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: #3fb56f;
  font-weight: 600;
}
.room-card-online::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #3fb56f;
  display: inline-block;
}

@media (max-width: 600px) {
  .topbar {
    padding: 0 14px;
  }
  .btn-dark .label,
  .btn-gold .label {
    display: none;
  }
  .btn-dark,
  .btn-gold {
    padding: 9px 11px;
  }
  .rooms-main {
    padding: 28px 16px 40px;
  }
  .create-room-row {
    flex-direction: column;
  }
  .room-list {
    grid-template-columns: 1fr;
  }
}

</style>
</head>
<body class="dash-body">

<header class="topbar">
  <div class="topbar-logo">
    <svg width="24" height="24" viewBox="0 0 30 30" fill="none">
      <path d="M5 21L5 12L9.5 16L15 8L20.5 16L25 12L25 21H5Z" stroke="#141414" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="15" cy="24" r="1.3" fill="#141414"/>
    </svg>
    <span>Kings' Chat-Room</span>
  </div>

  <div class="profile-section">
    <a class="btn-dark" href="profile.html">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="4.5" r="2.5" stroke="#fff" stroke-width="1.4"/><path d="M2 12.5c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="label">Profile</span>
    </a>
    <button class="btn-gold" id="signOutBtn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5.5 12.5H2.8A1.3 1.3 0 0 1 1.5 11.2V2.8A1.3 1.3 0 0 1 2.8 1.5h2.7" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 4.5 12.5 8 9 11.5M12.2 8H5.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">Sign out</span>
    </button>
  </div>
</header>

<main class="rooms-main">
  <div class="rooms-wrap">
    <h1>Chat rooms</h1>
    <p class="rooms-sub">Join one below, or start your own.</p>

    <div class="create-room-row">
      <input type="text" id="roomNameInput" placeholder="Name a new room, e.g. Coding">
      <button id="createRoomBtn" class="btn-gold">Create room</button>
    </div>

    <div class="room-list" id="roomList"></div>
  </div>
</main>

<script type="module">
// dashboard.js — room list
//
// Data model:
//   rooms/{roomId}                     -> { name, createdBy, createdByName, createdAt }
//   chats/{roomId}/{index}             -> (same shape as the single-room version, just nested under a room now)
//   presence/{roomId}/{uid}            -> true (who's currently inside that specific room)

import { auth, db } from './firebase-config.js';
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
import User from './user.js';

const roomListEl = document.getElementById('roomList');
const roomNameInput = document.getElementById('roomNameInput');
const createRoomBtn = document.getElementById('createRoomBtn');
const signOutBtn = document.getElementById('signOutBtn');

let currentUser = null;

// ---- Protected route ----
onAuthStateChanged(auth, function (user) {
  if (!user) {
    window.location.href = './signin.html';
    return;
  }
  currentUser = user;
});

// ---- Create a room ----
createRoomBtn.addEventListener('click', createRoom);
roomNameInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') createRoom();
});

function createRoom() {
  const name = roomNameInput.value.trim();
  if (!name || !currentUser) return;

  // The database rules enforce this too (auth.token.email_verified) \u2014 this
  // check is just so an unverified user gets a clear message instead of a
  // silent "permission denied" from Firebase.
  if (!currentUser.emailVerified) {
    alert('Please verify your email before creating a room. Check your inbox for the confirmation link.');
    return;
  }

  const storedUser = JSON.parse(localStorage.getItem('user') || 'null');

  // push() gives us a guaranteed-unique key, which matters here since room
  // names are free text and can't safely be used as a database key directly
  // (Firebase keys can't contain characters like "." or "#").
  const newRoomRef = push(ref(db, 'rooms'));
  const newRoomId = newRoomRef.key;

  set(newRoomRef, {
    name: name,
    createdBy: currentUser.uid,
    createdByName: storedUser ? storedUser.fullname : currentUser.email,
    createdAt: new Date().toLocaleString(),
  }).then(function () {
    // The creator is automatically the room's first (and only, for now) member.
    // Required under the new rules \u2014 without this, the creator couldn't read
    // or send messages in the room they just made.
    return set(ref(db, 'rooms/' + newRoomId + '/members/' + currentUser.uid), true);
  }).catch(function (err) {
    alert('Could not create room: ' + err.message);
  });

  roomNameInput.value = '';
}

// ---- Live room list ----
// A Set tracks which rooms we've already attached a presence listener to,
// so re-renders (new room added, etc.) don't stack duplicate listeners.
const subscribedPresence = new Set();

onValue(ref(db, 'rooms'), function (snapshot) {
  const data = snapshot.val();
  roomListEl.innerHTML = '';

  if (!data) {
    roomListEl.innerHTML = '<div class="room-list-empty"><div class="icon-circle">💬</div>No rooms yet — create the first one above.</div>';
    return;
  }

  Object.keys(data).forEach(function (roomId) {
    const room = data[roomId];

    const card = document.createElement('a');
    card.className = 'room-card';
    card.href = 'room.html?room=' + encodeURIComponent(roomId);
    card.innerHTML =
      '<div class="room-card-name">' + room.name + '</div>' +
      '<div class="room-card-meta">Started by ' + (room.createdByName || 'someone') + '</div>' +
      '<div class="room-card-online" id="online-' + roomId + '">0 online</div>';

    roomListEl.appendChild(card);

    if (!subscribedPresence.has(roomId)) {
      subscribedPresence.add(roomId);
      onValue(ref(db, 'presence/' + roomId), function (presenceSnap) {
        const count = presenceSnap.exists() ? Object.keys(presenceSnap.val()).length : 0;
        // Look the element up fresh each time — the list above gets
        // rebuilt on every room list change, so this element is a new node.
        const el = document.getElementById('online-' + roomId);
        if (el) el.textContent = count + ' online';
      });
    }
  });
});

// ---- Sign out ----
signOutBtn.addEventListener('click', function () {
  if (!confirm('Are you sure you want to sign out?')) return;

  signOut(auth).then(function () {
    User.clearSavedUser();
    window.location.href = './signin.html';
  });
});

</script>
</body>
</html>
